name: CI
on:
    push:
        branches: [ main ]
    pull_request: ~
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true
jobs:
    php-cs-fixer:
        name: "Coding Standard"
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v4
            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.2'
            # Use the php-cs-fixer version pinned in composer.json, not whatever
            # the latest global release is, so local and CI results agree.
            -   name: "Install dependencies"
                run: composer update --no-interaction --no-progress
            -   name: Check CS
                run: vendor/bin/php-cs-fixer fix --config=.php-cs-fixer.dist.php --dry-run --diff
    # Against the newest dependencies, the ones a development checkout gets: code
    # that supports several Symfony versions (SdcComponentAttributePass) is
    # written to be analysed against the newest one. On an older PHP, Composer
    # would resolve older Symfony and UX, and the analysis would differ from the
    # one run locally. The PHP versions the code has to run on are set in
    # phpstan.neon (phpVersion), not by the PHP that runs PHPStan.
    phpstan:
        name: "Static Analysis"
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout
                uses: actions/checkout@v4
            -   name: "Install PHP"
                uses: "shivammathur/setup-php@v2"
                with:
                    php-version: "8.5"
                    ini-values: memory_limit=-1
            -   name: "Install dependencies"
                run: composer update --no-interaction --no-progress
            -   name: "Run PHPStan"
                run: vendor/bin/phpstan analyse --configuration=phpstan.neon --no-progress
    # Every job that names a Symfony version pins it with SYMFONY_REQUIRE, which
    # symfony/flex (`tools: flex`) applies to every package of symfony/symfony
    # during `composer update`. Without Flex the variable means nothing and a job
    # gets the newest Symfony its PHP allows, whatever its name says. The
    # "Check the Symfony version" step fails a job that ends up elsewhere.
    #
    # Symfony versions: 6.4 and 7.4 (LTS) and the current stable 8.x. A minor
    # that is out of maintenance is replaced by its successor, not kept.
    tests:
        name: "Tests (PHP ${{ matrix.php-version }}, Symfony ${{ matrix.symfony }})"
        runs-on: ${{ matrix.operating-system }}
        env:
            SYMFONY_REQUIRE: ${{ matrix.symfony }}
        strategy:
            fail-fast: false
            matrix:
                php-version:
                    - "8.2"
                    - "8.3"
                    - "8.4"
                    - "8.5"
                symfony:
                    - '6.4.*'
                    - '7.4.*'
                    - '8.1.*'
                operating-system:
                    - "ubuntu-latest"
                # composer.json allows PHP 8.1, which only Symfony 6.4 still
                # supports (7.0 needs 8.2) and which resolves Symfony UX to 2.x
                # (3.0 needs 8.4). One job instead of 8.1 in the axis above and
                # two more excludes.
                include:
                    -   php-version: "8.1"
                        symfony: '6.4.*'
                        operating-system: "ubuntu-latest"
                # Symfony 8 needs PHP 8.4.
                exclude:
                    -   php-version: "8.2"
                        symfony: '8.1.*'
                    -   php-version: "8.3"
                        symfony: '8.1.*'
        steps:
            -   name: Checkout
                uses: actions/checkout@v4
            -   name: "Install PHP"
                uses: "shivammathur/setup-php@v2"
                with:
                    coverage: "pcov"
                    php-version: "${{ matrix.php-version }}"
                    ini-values: memory_limit=-1
                    tools: flex, php-coveralls
            -   name: Get composer cache directory
                id: composer-cache
                run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
            -   name: "Cache dependencies"
                uses: "actions/cache@v4"
                with:
                    path: ${{ steps.composer-cache.outputs.dir }}
                    key: "php-${{ matrix.php-version }}-symfony-${{ matrix.symfony }}"
                    restore-keys: "php-${{ matrix.php-version }}-symfony-${{ matrix.symfony }}"
            -   name: "Install highest dependencies"
                run: |
                    composer update --no-interaction --no-progress
            -   &check-symfony-version
                name: "Check the Symfony version"
                run: |
                    installed=$(composer show symfony/http-kernel --format=json | jq -r '.versions[0]')
                    echo "symfony/http-kernel $installed, SYMFONY_REQUIRE $SYMFONY_REQUIRE"
                    if [[ "$installed" != "v${SYMFONY_REQUIRE%.\*}."* ]]; then
                        echo "::error::Symfony $SYMFONY_REQUIRE was asked for, $installed is installed."
                        exit 1
                    fi
            -   name: Execute tests via PHPUnit
                run: vendor/bin/phpunit --coverage-clover build/reports/clover.xml
            -   name: Upload coverage results to Coveralls
                env:
                    COVERALLS_REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: |
                    php-coveralls --coverage_clover=build/reports/clover.xml --json_path=build/reports/coveralls-upload.json -v
                continue-on-error: true

    # The lowest version of every dependency composer.json allows, on the lowest
    # PHP and Symfony: keeps the lower bounds of composer.json honest.
    tests-lowest:
        name: "Tests (lowest dependencies, PHP 8.1, Symfony 6.4.*)"
        runs-on: ubuntu-latest
        env:
            SYMFONY_REQUIRE: '6.4.*'
        steps:
            -   name: Checkout
                uses: actions/checkout@v4
            -   name: "Install PHP"
                uses: "shivammathur/setup-php@v2"
                with:
                    php-version: "8.1"
                    ini-values: memory_limit=-1
                    tools: flex
            -   name: "Install lowest dependencies"
                run: composer update --prefer-lowest --prefer-stable --no-interaction --no-progress
            -   *check-symfony-version
            -   name: Execute tests via PHPUnit
                run: vendor/bin/phpunit

    # Installs the bundle from this checkout into a fresh Symfony skeleton,
    # builds it for production and checks the pages a web server serves, in
    # dev and in prod; tests_e2e/run_e2e.sh says what exactly. The newest
    # skeleton with and without LiveComponent, and the oldest Symfony and PHP
    # the bundle supports (UX 2.x), where the routes of --action pages load
    # only through the route import of the recipe.
    e2e-tests:
        name: "E2E (${{ matrix.variant }}, PHP ${{ matrix.php-version }}, skeleton ${{ matrix.skeleton || 'newest' }})"
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   variant: full
                        php-version: "8.5"
                        skeleton: ""
                    -   variant: no-live
                        php-version: "8.5"
                        skeleton: ""
                    -   variant: full
                        php-version: "8.1"
                        skeleton: "6.4.*"
        steps:
            -   name: Checkout
                uses: actions/checkout@v4
            -   name: "Install PHP"
                uses: "shivammathur/setup-php@v2"
                with:
                    php-version: "${{ matrix.php-version }}"
                    tools: composer
            -   name: Run the E2E test
                env:
                    E2E_SKELETON: ${{ matrix.skeleton }}
                run: tests_e2e/run_e2e.sh "${{ matrix.variant }}"

    # The bundle supports symfony/ux-twig-component ^2.20|^3.0. The matrix gets
    # UX 2.x wherever UX 3 cannot install — PHP below 8.4, or Symfony 6.4 — and
    # UX 3 everywhere else. UX 2 on Symfony 8 is the one combination left, and
    # without this job the 2.x half of the range stops being tested on the
    # Symfony an application upgrades to first.
    tests-lowest-ux:
        name: "Tests (UX 2.x, PHP 8.5, Symfony 8.1.*)"
        runs-on: ubuntu-latest
        env:
            SYMFONY_REQUIRE: '8.1.*'
        steps:
            -   name: Checkout
                uses: actions/checkout@v4
            -   name: "Install PHP"
                uses: "shivammathur/setup-php@v2"
                with:
                    php-version: "8.5"
                    ini-values: memory_limit=-1
                    tools: flex
            -   name: "Pin Symfony UX to 2.x"
                run: |
                    composer require --no-update "symfony/ux-twig-component:^2.20"
                    composer require --no-update --dev "symfony/ux-live-component:^2.32" "symfony/stimulus-bundle:^2.32"
            -   name: "Install dependencies"
                run: composer update --no-interaction --no-progress
            -   *check-symfony-version
            -   name: "Check the Symfony UX version"
                run: |
                    installed=$(composer show symfony/ux-twig-component --format=json | jq -r '.versions[0]')
                    echo "symfony/ux-twig-component $installed"
                    if [[ "$installed" != v2.* ]]; then
                        echo "::error::Symfony UX 2.x was asked for, $installed is installed."
                        exit 1
                    fi
            -   name: Execute tests via PHPUnit
                run: vendor/bin/phpunit

    tests-no-maker:
        name: "Tests without Maker (PHP 8.5, Symfony 8.1.*)"
        runs-on: ubuntu-latest
        env:
            SYMFONY_REQUIRE: '8.1.*'
        steps:
            -   name: Checkout
                uses: actions/checkout@v4
            -   name: "Install PHP"
                uses: "shivammathur/setup-php@v2"
                with:
                    php-version: "8.5"
                    ini-values: memory_limit=-1
                    tools: flex
            -   name: "Install highest dependencies"
                run: composer update --no-interaction --no-progress
            -   name: "Remove MakerBundle"
                run: composer remove --dev symfony/maker-bundle --no-interaction
            -   *check-symfony-version
            -   name: Execute tests via PHPUnit
                run: vendor/bin/phpunit

    tests-no-live-component:
        name: "Tests without LiveComponent (PHP 8.5, Symfony 8.1.*)"
        runs-on: ubuntu-latest
        env:
            SYMFONY_REQUIRE: '8.1.*'
        steps:
            -   name: Checkout
                uses: actions/checkout@v4
            -   name: "Install PHP"
                uses: "shivammathur/setup-php@v2"
                with:
                    php-version: "8.5"
                    ini-values: memory_limit=-1
                    tools: flex
            -   name: "Install highest dependencies"
                run: composer update --no-interaction --no-progress
            -   name: "Remove LiveComponent"
                run: composer remove --dev symfony/ux-live-component symfony/stimulus-bundle --no-interaction
            -   *check-symfony-version
            -   name: Execute tests via PHPUnit
                run: vendor/bin/phpunit
